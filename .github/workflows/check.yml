# Checks the plugin on every push and pull request with the rules of the registry; nothing is
# published. The same check runs on your machine: node tools/validate-plugin.mjs . --zip plugin.zip
name: Check
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/validate-plugin.mjs . --zip plugin.zip
